[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:data-ingestion]
directory=/svc/data-ingestion
command=uvicorn app.main:app --host 0.0.0.0 --port 8001 --log-level info
environment=SERVICE_NAME="data-ingestion",PORT="8001"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sar-spill-intelligence]
directory=/svc/sar-spill-intelligence
command=uvicorn app.main:app --host 0.0.0.0 --port 8008 --log-level info
environment=SERVICE_NAME="sar-spill-intelligence",PORT="8008"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:lookalike-engine]
directory=/svc/lookalike-engine
command=uvicorn app.main:app --host 0.0.0.0 --port 8009 --log-level info
environment=SERVICE_NAME="lookalike-engine",PORT="8009"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
