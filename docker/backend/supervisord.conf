[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:evidence-fusion]
directory=/svc/evidence-fusion
command=uvicorn app.main:app --host 0.0.0.0 --port 8010 --log-level info
environment=SERVICE_NAME="evidence-fusion",PORT="8010",POSTGRES_HOST="postgres",POSTGRES_PORT="5432",POSTGRES_DB="maritime_oilspill",POSTGRES_USER="postgres",POSTGRES_PASSWORD="postgres",REDIS_HOST="redis",REDIS_PORT="6379"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

