[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:ais-reader]
directory=/svc/ais-reader
command=python -u app/reader.py
environment=SERVICE_NAME="ais-reader"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ais-analytics]
directory=/svc/ais-analytics
command=uvicorn app.main:app --host 0.0.0.0 --port 8002 --log-level info
environment=SERVICE_NAME="ais-analytics",PORT="8002"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:anomaly-detection]
directory=/svc/anomaly-detection
command=uvicorn app.main:app --host 0.0.0.0 --port 8003 --log-level info
environment=SERVICE_NAME="anomaly-detection",PORT="8003",ML_MODEL_DIR="/data/models"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

