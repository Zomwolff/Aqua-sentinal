server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> api-gateway (strip the /api prefix)
    location /api/ {
        proxy_pass http://backend:8015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SAR scene artifacts served by the gateway's StaticFiles mount
    location /artifacts/ {
        proxy_pass http://backend:8015/artifacts/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /fusion/ { proxy_pass http://fusion:8017/; proxy_read_timeout 300s; }

    # Live WebSocket feed
    location /live {
        proxy_pass http://backend:8015/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
