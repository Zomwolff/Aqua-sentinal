x-common-env: &common-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-aqua_sentinel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
  POSTGRES_DB: ${POSTGRES_DB:-aqua_sentinel}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  AIS_BBOX_MIN_LAT: ${AIS_BBOX_MIN_LAT:-14.0}
  AIS_BBOX_MIN_LON: ${AIS_BBOX_MIN_LON:-68.0}
  AIS_BBOX_MAX_LAT: ${AIS_BBOX_MAX_LAT:-25.0}
  AIS_BBOX_MAX_LON: ${AIS_BBOX_MAX_LON:-77.5}

# Shared by sar (Sentinel-1) and eo (Sentinel-2) — both talk to the same GEE
# service account.
x-gee-env: &gee-env
  GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
  GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-key.json}

x-depends-defaults: &depends-defaults
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  postgres:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqua_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aqua_sentinel}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqua_sentinel} -d ${POSTGRES_DB:-aqua_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aqua-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aqua-net

  ais:
    build:
      context: .
      dockerfile: docker/ais/Dockerfile
    restart: unless-stopped
    depends_on:
      <<: *depends-defaults
    environment:
      <<: *common-env
      AIS_PROVIDER: none
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      VESSELAPI_API_KEY: ${VESSELAPI_API_KEY:-}
      VESSELAPI_BBOX_MIN_LAT: ${VESSELAPI_BBOX_MIN_LAT:-18.4}
      VESSELAPI_BBOX_MIN_LON: ${VESSELAPI_BBOX_MIN_LON:-71.5}
      VESSELAPI_BBOX_MAX_LAT: ${VESSELAPI_BBOX_MAX_LAT:-19.8}
      VESSELAPI_BBOX_MAX_LON: ${VESSELAPI_BBOX_MAX_LON:-73.0}
      VESSELAPI_POLL_INTERVAL_SECONDS: ${VESSELAPI_POLL_INTERVAL_SECONDS:-60}
      WINDOW_MINUTES: ${WINDOW_MINUTES:-15}
      PROXIMITY_RADIUS_M: ${PROXIMITY_RADIUS_M:-1000}
      AIS_GAP_THRESHOLD_MINUTES: ${AIS_GAP_THRESHOLD_MINUTES:-30}
      ERRATIC_COURSE_VARIANCE: ${ERRATIC_COURSE_VARIANCE:-2500}
      LOITERING_THRESHOLD: ${LOITERING_THRESHOLD:-0.8}
      STS_DISTANCE_THRESHOLD_M: ${STS_DISTANCE_THRESHOLD_M:-500}
      STS_SPEED_THRESHOLD_KN: ${STS_SPEED_THRESHOLD_KN:-2.0}
      STS_MIN_DURATION_MIN: ${STS_MIN_DURATION_MIN:-30}
      MAX_PLAUSIBLE_AIS_ERROR_M: ${MAX_PLAUSIBLE_AIS_ERROR_M:-500}
      MAX_PHYSICAL_SPEED_MS: ${MAX_PHYSICAL_SPEED_MS:-25.7}
      DARK_VESSEL_GAP_MINUTES: ${DARK_VESSEL_GAP_MINUTES:-90}
      DARK_VESSEL_SCAN_INTERVAL_S: ${DARK_VESSEL_SCAN_INTERVAL_S:-300}
      DARK_VESSEL_MAX_MATCH_DISTANCE_M: ${DARK_VESSEL_MAX_MATCH_DISTANCE_M:-5000}
      DARK_VESSEL_MAX_MATCH_TIME_S: ${DARK_VESSEL_MAX_MATCH_TIME_S:-1800}
      RISK_DECAY_RATE: ${RISK_DECAY_RATE:-0.05}
      RISK_TIER_MEDIUM: ${RISK_TIER_MEDIUM:-20}
      RISK_TIER_HIGH: ${RISK_TIER_HIGH:-50}
      RISK_TIER_CRITICAL: ${RISK_TIER_CRITICAL:-75}
      ML_TRAIN_INTERVAL_S: ${ML_TRAIN_INTERVAL_S:-3600}
      ML_MAX_MODEL_AGE_H: ${ML_MAX_MODEL_AGE_H:-25}
      ML_MIN_SAMPLES: ${ML_MIN_SAMPLES:-100}
    volumes:
      - ml-models:/data/models
    networks:
      - aqua-net

  sar:
    build:
      context: .
      dockerfile: docker/sar/Dockerfile
    restart: unless-stopped
    depends_on:
      <<: *depends-defaults
    environment:
      <<: [*common-env, *gee-env]
      AIS_PROVIDER: none
      INJECT_SYNTHETIC: ${INJECT_SYNTHETIC:-false}
      SAR_ALLOW_MOCK_FALLBACK: ${SAR_ALLOW_MOCK_FALLBACK:-false}
      SAR_MIN_AREA_M2: ${SAR_MIN_AREA_M2:-}
      SAR_BRIGHT_TARGET_THRESHOLD: ${SAR_BRIGHT_TARGET_THRESHOLD:-}
      SAR_ARTIFACT_ROOT: ${SAR_ARTIFACT_ROOT:-/data/artifacts}
      SAR_CFAR_K: ${SAR_CFAR_K:-2.5}
    volumes:
      - ./secret/gee-key.json:/run/secrets/gee-key.json:ro
      - sar-scene-artifacts:/data/artifacts
    networks:
      - aqua-net

  # ── eo: the real, ready-to-run model — Sentinel-2 10-band CNN ────────────
  eo:
    build:
      context: .
      dockerfile: docker/eo/Dockerfile
    restart: unless-stopped
    depends_on:
      <<: *depends-defaults
    environment:
      <<: [*common-env, *gee-env]
      EO_CLOUD_PCT_MAX: ${EO_CLOUD_PCT_MAX:-20}
      EO_SEARCH_WINDOW_DAYS: ${EO_SEARCH_WINDOW_DAYS:-5}
      EO_EXPORT_SCALE_M: ${EO_EXPORT_SCALE_M:-10}
    volumes:
      - ./secret/gee-key.json:/run/secrets/gee-key.json:ro
      - sar-scene-artifacts:/data/artifacts   # writes under /data/artifacts/eo
    ports:
      - "8016:8016"
    networks:
      - aqua-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      <<: *depends-defaults
      ais:
        condition: service_started
      sar:
        condition: service_started
      eo:
        condition: service_started
    environment:
      <<: *common-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DASHBOARD_ORIGINS: "*"
      EVIDENCE_SPATIAL_WINDOW_M: ${EVIDENCE_SPATIAL_WINDOW_M:-5000}
      EVIDENCE_TEMPORAL_WINDOW_HOURS: ${EVIDENCE_TEMPORAL_WINDOW_HOURS:-6}
      ATTRIBUTION_SPATIAL_WINDOW_M: ${ATTRIBUTION_SPATIAL_WINDOW_M:-20000}
      ATTRIBUTION_TEMPORAL_WINDOW_H: ${ATTRIBUTION_TEMPORAL_WINDOW_H:-6.0}
      ATTRIBUTION_W_DISTANCE: ${ATTRIBUTION_W_DISTANCE:-0.25}
      ATTRIBUTION_W_TRAJECTORY: ${ATTRIBUTION_W_TRAJECTORY:-0.25}
      ATTRIBUTION_W_TIME: ${ATTRIBUTION_W_TIME:-0.20}
      ATTRIBUTION_W_BEHAVIOR: ${ATTRIBUTION_W_BEHAVIOR:-0.15}
      ATTRIBUTION_W_WIND: ${ATTRIBUTION_W_WIND:-0.15}
      SEVERITY_AREA_SATURATION_M2: ${SEVERITY_AREA_SATURATION_M2:-10000000}
      SEVERITY_PROTECTED_RADIUS_M: ${SEVERITY_PROTECTED_RADIUS_M:-10000}
      SEVERITY_COAST_RADIUS_M: ${SEVERITY_COAST_RADIUS_M:-20000}
      TASKING_DEDUP_HOURS: ${TASKING_DEDUP_HOURS:-6}
      # drift-forecast (oil-spread v2 physics)
      DRIFT_ENSEMBLE_PARTICLES: ${DRIFT_ENSEMBLE_PARTICLES:-500}
      DRIFT_DIFFUSIVITY_M2_S: ${DRIFT_DIFFUSIVITY_M2_S:-10.0}
      OIL_DENSITY_KG_M3: ${OIL_DENSITY_KG_M3:-850}
      OIL_KINEMATIC_VISCOSITY_M2_S: ${OIL_KINEMATIC_VISCOSITY_M2_S:-0.00005}
      OIL_WATER_INTERFACIAL_TENSION_N_M: ${OIL_WATER_INTERFACIAL_TENSION_N_M:-0.02}
      WATER_DENSITY_KG_M3: ${WATER_DENSITY_KG_M3:-1025}
      WINDAGE_MIN_PERCENT: ${WINDAGE_MIN_PERCENT:-1.0}
      WINDAGE_MAX_PERCENT: ${WINDAGE_MAX_PERCENT:-4.0}
      WINDAGE_RESAMPLE_INTERVAL_S: ${WINDAGE_RESAMPLE_INTERVAL_S:-900}
      WIND_DEFLECTION_ENABLED: ${WIND_DEFLECTION_ENABLED:-false}
      WIND_DEFLECTION_DEG: ${WIND_DEFLECTION_DEG:-20.0}
    volumes:
      - sar-scene-artifacts:/data/artifacts:ro
    ports:
      - "8015:8015"
    networks:
      - aqua-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - aqua-net

  fusion:
    build:
      context: .
      dockerfile: fusion/Dockerfile
    volumes:
      - sar-scene-artifacts:/data/artifacts
    ports: ["8017:8017"]
    networks: [aqua-net]

  simulator:
    build: ./simulator
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      ais:
        condition: service_started
    volumes:
      - ./data:/data:ro
    networks:
      - aqua-net

volumes:
  pgdata:
  sar-scene-artifacts:
  ml-models:

networks:
  aqua-net:
    driver: bridge
